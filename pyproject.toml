[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-browser"
version = "0.1.14"
description = "Browser automation for scholarly paper access in the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
classifiers = [
]
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" }
]
dependencies = [
    "aiohttp",
    # playwright is imported at module level throughout browser automation code.
    # Without it, `pip install scitex-browser` yields an unimportable package.
    "playwright>=1.40.0",
    # scitex-logging provides .success/.fail logger methods used throughout
    # ChromeProfileManager, interaction/, pdf/, remote/, stealth/, etc.
    "scitex-logging>=0.1.0",
    "scitex-config>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio>=0.23.0",
    "scitex-dev>=0.11.7",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-browser[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-browser"
Repository = "https://github.com/ywatanabe1989/scitex-browser"
Issues = "https://github.com/ywatanabe1989/scitex-browser/issues"
Documentation = "https://scitex-browser.readthedocs.io"

[project.entry-points."scitex_dev.skills"]
scitex-browser = "scitex_browser"

[project.entry-points."scitex_dev.docs"]
scitex-browser = "scitex_browser"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
