# Resolve the protected tagged source once on a hosted runner.
# Native tests/builds use one pinned, qualified Browser executor.
# Publication consumes that source and its exact artifact, then revalidates both.
name: release
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish (e.g. v0.10.19) \u2014 must already exist on the repo"
        required: true
        type: string
env:
  SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}
  SCITEX_CI_SIF: ${{ vars.SCITEX_CI_SIF }}
  SCITEX_CI_SIF_SHA256: ${{ vars.SCITEX_CI_SIF_SHA256 }}
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
    - name: Resolve version
      id: ver
      env:
        SCITEX_BROWSER_RELEASE_TAG: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
          [[ "$GITHUB_REF" == refs/tags/* ]]
          v="${GITHUB_REF#refs/tags/}"
        elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          v="$SCITEX_BROWSER_RELEASE_TAG"
        else
          exit 1
        fi
        [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.ver.outputs.version }}
        fetch-depth: 0
    - name: Verify tagged source matches the tested trigger
      id: source
      run: |
        set -euo pipefail
        git merge-base --is-ancestor HEAD origin/main
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        browser_release_source_sha="$(git rev-parse HEAD)"
        printf 'sha=%s\n' "$browser_release_source_sha" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Revalidate protected remote source
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SCITEX_BROWSER_RELEASE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        SCITEX_BROWSER_RELEASE_VERSION: ${{ steps.ver.outputs.version }}
      run: python -I -S -B .github/ci/release-source.py --tag "$SCITEX_BROWSER_RELEASE_VERSION" --commit "$SCITEX_BROWSER_RELEASE_SOURCE_SHA"
  test:
    needs: source
    permissions:
      contents: read
    uses: scitex-ai/.github/.github/workflows/leaf-release-sif.yml@3b763671ca92ddf9252a68423c777156d9e555ca
    with:
      operation: test
      source_commit: ${{ needs.source.outputs.source_sha }}
      release_tag: ${{ needs.source.outputs.version }}
  build:
    needs:
    - source
    - test
    permissions:
      contents: read
    uses: scitex-ai/.github/.github/workflows/leaf-release-sif.yml@3b763671ca92ddf9252a68423c777156d9e555ca
    with:
      operation: build
      source_commit: ${{ needs.source.outputs.source_sha }}
      release_tag: ${{ needs.source.outputs.version }}
  publish:
    needs:
    - source
    - build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-browser
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.source.outputs.source_sha }}
    - uses: actions/download-artifact@v4
      with:
        name: browser-dist-${{ needs.source.outputs.source_sha }}
        path: dist
    - name: Publish to PyPI via manual OIDC trusted publishing in the SIF
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SCITEX_BROWSER_RELEASE_SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
        SCITEX_BROWSER_RELEASE_VERSION: ${{ needs.source.outputs.version }}
      run: bash .github/ci/exec-in-sif.sh publish-in-sif.sh 3.12
  release:
    needs:
    - source
    - build
    - publish
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.source.outputs.source_sha }}
    - uses: actions/download-artifact@v4
      with:
        name: browser-dist-${{ needs.source.outputs.source_sha }}
        path: dist
    - name: Extract release notes from CHANGELOG.md
      run: |
        VERSION="${{ needs.source.outputs.version }}"
        VERSION="${VERSION#v}"
        awk -v v="$VERSION" '
          $0 ~ "^## \\[" v "\\]" {p=1; next}
          p && /^## \[/ {exit}
          p
        ' CHANGELOG.md > release-notes.md || true
        if [ ! -s release-notes.md ]; then
          echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
        fi
    - name: Revalidate release source and archives
      env:
        SCITEX_BROWSER_RELEASE_SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
        SCITEX_BROWSER_RELEASE_VERSION: ${{ needs.source.outputs.version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bash .github/ci/exec-in-sif.sh verify-release-in-sif.sh 3.12
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.source.outputs.version }}" \
          --title "${{ needs.source.outputs.version }}" \
          --notes-file release-notes.md \
          dist/*
